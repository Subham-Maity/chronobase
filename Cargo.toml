[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Subham-Maity/chronobase"

[workspace.dependencies]
# Async runtime (current-thread runtime, subprocesses, timers, signals, fs)
tokio = { version = "1.54", default-features = false, features = ["rt", "process", "time", "sync", "fs", "signal", "macros", "io-util"] }
# Serialization for v1-compatible JSON store
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Typed per-feature errors
thiserror = "2.0"
# Structured logging without secrets
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Local timestamps, relative time, and schedule calculations
chrono = { version = "0.4", features = ["serde", "clock"] }
# Cron expression parsing and next-due calculation
cron = "0.17"
# URL parsing for password extraction and masking
url = "2.5"
# Cross-platform OS data directory lookup
directories = "6.0"
# Advisory file locking on the JSON store
fs4 = "1.1"
# Windows console attachment for CLI/headless mode
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }
# Native desktop UI
slint = { version = "1.19.1", default-features = false, features = ["compat-1-18", "std", "backend-winit"] }
slint-build = "1.19.1"
# Dev-only mocking for CommandRunner and repositories
mockall = "0.15"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
