<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" width="880" height="270" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1917"/>
      <stop offset="55%" stop-color="#14110F"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.15" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#D6D3D1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#D6D3D1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.88" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#A5D8F0" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#A5D8F0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.025"/>
    </linearGradient>
  </defs>

  <rect width="880" height="270" rx="16" fill="url(#bg)" stroke="#F5F5F4" stroke-opacity="0.10"/>
  <rect width="880" height="270" rx="16" fill="url(#glowL)"/>
  <rect width="880" height="270" rx="16" fill="url(#glowR)"/>

  <!-- Header -->
  <text x="36" y="42" fill="#F5F5F4" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="700" letter-spacing="-0.3">ChronoBase — Native Rust Architecture</text>
  <text x="36" y="62" fill="#A8A29E" font-family="system-ui, -apple-system, sans-serif" font-size="12">Zero cloud · Zero Node runtime · 10.7 MB native desktop &amp; headless scheduler</text>

  <!-- Node 1: Slint UI / CLI -->
  <rect x="36" y="88" width="230" height="146" rx="12" fill="url(#card)" stroke="#F5F5F4" stroke-opacity="0.14"/>
  <rect x="36" y="100" width="3" height="28" rx="1.5" fill="#A5D8F0"/>
  <text x="54" y="116" fill="#F5F5F4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">crates/app (chronobase)</text>
  <text x="54" y="138" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Slint 1.19 Strata UI (femtovg / SW)</text>
  <text x="54" y="158" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Dedicated Tokio runtime thread</text>
  <text x="54" y="178" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• --headless daemon (Ctrl+C / SIGTERM)</text>
  <text x="54" y="198" fill="#A5D8F0" font-family="monospace" font-size="11">backup --all | --group | list</text>

  <!-- Arrow 1 -->
  <path d="M276 161 H314 M308 155 L315 161 L308 167" stroke="#A5D8F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 2: chronobase-core -->
  <rect x="324" y="88" width="250" height="146" rx="12" fill="url(#card)" stroke="#F5F5F4" stroke-opacity="0.14"/>
  <rect x="324" y="100" width="3" height="28" rx="1.5" fill="#9AD7B0"/>
  <text x="342" y="116" fill="#F5F5F4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">crates/core (chronobase-core)</text>
  <text x="342" y="138" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Atomic JSON store + fs4 lock</text>
  <text x="342" y="158" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Single-task cron ScheduleRunner</text>
  <text x="342" y="178" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Canonicalized path-containment</text>
  <text x="342" y="198" fill="#9AD7B0" font-family="monospace" font-size="11">Zero shell · Secret redaction</text>

  <!-- Arrow 2 -->
  <path d="M584 161 H622 M616 155 L623 161 L616 167" stroke="#A5D8F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Node 3: Engine / Targets -->
  <rect x="632" y="88" width="212" height="146" rx="12" fill="url(#card)" stroke="#F5F5F4" stroke-opacity="0.14"/>
  <rect x="632" y="100" width="3" height="28" rx="1.5" fill="#E9B872"/>
  <text x="650" y="116" fill="#F5F5F4" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Database Engines</text>
  <text x="650" y="138" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• PostgreSQL (PGPASSWORD env)</text>
  <text x="650" y="158" fill="#A8A29E" font-family="monospace" font-size="11">  pg_dump / psql --single-tx</text>
  <text x="650" y="180" fill="#D6D3D1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• MongoDB (0600 temp --config)</text>
  <text x="650" y="200" fill="#A8A29E" font-family="monospace" font-size="11">  mongodump / mongorestore</text>
</svg>
